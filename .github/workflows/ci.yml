name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nová revize ve stejné větvi zruší předchozí běh — nemá smysl čekat na
# výsledek, který už nikoho nezajímá.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: citadela-app

# Sdílené proměnné. Nejsou to tajemství: databáze je jednorázový kontejner
# a klíč platí jen po dobu běhu jobu. Skutečné hodnoty patří do secrets.
env:
  DATABASE_URL: postgresql://citadela:citadela@localhost:5432/citadela_ci
  AUTH_SECRET: ci-only-not-a-real-secret-000000000000000=
  AUTH_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"
  BOOKING_HOTEL_PATH: cz/citadela

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citadela
          POSTGRES_PASSWORD: citadela
          POSTGRES_DB: citadela_ci
        ports:
          - 5432:5432
        # Job nesmí začít dřív, než databáze skutečně přijímá spojení.
        options: >-
          --health-cmd "pg_isready -U citadela"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Odpovídá `engines.node` v package.json.
          node-version: "20.11"
          cache: npm
          cache-dependency-path: citadela-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # src/generated/prisma není v gitu — bez tohohle kroku neprojde
        # ani typecheck.
        run: npx prisma generate

      - name: Create database schema
        # Build předrenderuje stránky, které se dotýkají Prismy — prázdná
        # databáze by nestačila, tabulky musí existovat. Záměrně `migrate
        # deploy`, ne `db push`: CI tím zároveň ověří, že migrace v repu
        # sedí na schéma.
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  reader-regression:
    name: NFC reader regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nemá smysl pouštět simulátor, když neprojde ani typecheck.
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citadela
          POSTGRES_PASSWORD: citadela
          POSTGRES_DB: citadela_ci
        ports:
          - 5432:5432
        # Job nesmí začít dřív, než databáze skutečně přijímá spojení.
        options: >-
          --health-cmd "pg_isready -U citadela"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ADMIN_EMAIL: ci@citadela.test
      ADMIN_PASSWORD: ci-password-not-real
      SEED_DEMO_ACCESS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: npm
          cache-dependency-path: citadela-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - name: Build
        run: npm run build

      # Server i kontrola v jednom kroku: proces tak žije přesně tak dlouho,
      # jak je potřeba, a nespoléháme na to, že přežije mezi kroky.
      - name: Access control regression
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/cs; then
              echo "Server naběhl po ${i}s."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Server nenaběhl včas."
              exit 1
            fi
            sleep 1
          done

          npx tsx scripts/ci-reader-check.ts
          npx tsx scripts/check-double-booking.mts
